<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل رادیو</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #1d2130; --muted: #6b7183; --line: #e3e5ea;
  --accent: #3b5bdb; --accent-soft: #e7ecff; --danger: #c92a2a; --ok: #2b8a3e; --hover: #f1f3f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141a; --card: #1b1e26; --text: #e7e9ee; --muted: #9096a6; --line: #2b2f3a;
    --accent: #7c95ff; --accent-soft: #252c47; --danger: #ff6b6b; --ok: #69db7c; --hover: #232733;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", Tahoma, "Vazirmatn", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
.pill { font-size: 13px; color: var(--muted); }
button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; min-height: 34px; }
button:hover { background: var(--hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
h2 .pill { font-weight: normal; }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h2 { flex: 1; }

.now { display: grid; gap: 10px; }
.state { font-size: 13px; color: var(--ok); }
.state.paused { color: var(--danger); }
.title { font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.artist { color: var(--muted); overflow-wrap: anywhere; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar div { height: 100%; width: 0; background: var(--accent); transition: width .5s linear; }
.times { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.controls button { min-width: 120px; min-height: 42px; }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: fit-content; }
.modes button { border: 0; border-radius: 0; min-width: 84px; }
.modes button + button { border-inline-start: 1px solid var(--line); }
.modes button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }

ol, ul { list-style: none; margin: 0; padding: 0; }
.rows { max-height: 62vh; overflow-y: auto; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.row:hover { background: var(--hover); }
.row.playing { background: var(--accent-soft); }
.row.drag-over { box-shadow: inset 0 3px 0 var(--accent); }
.row.dragging { opacity: .4; }
.grip { cursor: grab; color: var(--muted); user-select: none; padding: 0 2px; }
.num { width: 2.2em; text-align: center; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.meta { flex: 1; min-width: 0; display: grid; }
.nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fd { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { display: flex; gap: 8px; min-width: 0; }
.tag { font-size: 12px; color: var(--accent); white-space: nowrap; }
.tag:empty { display: none; }
.acts { display: flex; gap: 4px; flex-shrink: 0; }
.acts button { min-width: 32px; min-height: 32px; padding: 2px 6px; font-size: 13px; }
.acts button.del:hover { color: var(--danger); }
.empty { color: var(--muted); padding: 16px 4px; }
@media (max-width: 600px) {
  .row { flex-wrap: wrap; row-gap: 4px; }
  .meta { flex-basis: calc(100% - 5em); }
  .acts { width: 100%; padding-inline-start: 3.4em; }
  .controls button { flex: 1; min-width: 0; }
  .modes { width: 100%; }
  .modes button { flex: 1; min-width: 0; }
}

.lib-tools { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.lib-tools input, .lib-tools select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 34px; }
.lib-tools input { flex: 1; min-width: 140px; }
.in-list { color: var(--ok); font-size: 12px; }

#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>📻 رادیو</h1>
    <span class="pill" id="listeners"></span>
    <button id="listen">🎧 گوش دادن</button>
    <audio id="player" preload="none"></audio>
  </header>

  <section class="card now">
    <div class="state" id="state">…</div>
    <div class="title" id="title" dir="auto">…</div>
    <div class="artist" id="artist" dir="auto"></div>
    <div class="bar" dir="ltr"><div id="progress"></div></div>
    <div class="times" dir="ltr"><span id="elapsed">–</span><span id="duration">–</span></div>
    <div class="controls">
      <button id="pause" class="primary">⏸ توقف</button>
      <button id="skip">⏭ آهنگ بعدی</button>
    </div>
    <div class="modes" id="modes">
      <button data-mode="normal">به ترتیب</button>
      <button data-mode="randomize">شافل</button>
      <button data-mode="random">تصادفی</button>
    </div>
  </section>

  <section class="card" id="queue-card" hidden>
    <div class="card-head">
      <h2>صف «بعدی پخش شود» <span class="pill" id="queue-count"></span></h2>
      <button id="clear-queue">پاک کردن صف</button>
    </div>
    <ol class="rows" id="queue"></ol>
  </section>

  <div class="cols">
    <section class="card">
      <div class="card-head">
        <h2>لیست پخش <span class="pill" id="count"></span></h2>
      </div>
      <ol class="rows" id="tracks"></ol>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>کتابخانه <span class="pill" id="lib-count"></span></h2>
        <button id="add-all">افزودن همه به لیست</button>
      </div>
      <div class="lib-tools">
        <input id="search" type="search" placeholder="جستجو در آهنگ‌ها…">
        <select id="folder"><option value="">همه‌ی پوشه‌ها</option></select>
        <button id="rescan" title="دوباره خواندن پوشه‌ی موزیک">↻</button>
      </div>
      <ul class="rows" id="library"></ul>
    </section>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let st = null, fetchedAt = 0, tracksKey = '', lib = [], dragFrom = null;

const base = f => f.split('/').pop().replace(/\.[^.]+$/, '');
const dir = f => f.includes('/') ? f.slice(0, f.lastIndexOf('/')) : '';
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmt(s) {
  if (!(s >= 0) || !isFinite(s)) return '–';
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function call(path, body) {
  const opts = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch('/api/' + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { toast('خطا: ' + (data.error || r.status)); throw new Error(data.error || r.status); }
  return data;
}
// the radio re-picks its next track right after a change; read again once that has settled
async function post(path, body = {}, msg) {
  render(await call(path, body));
  if (msg) toast(msg);
  setTimeout(refresh, 700);
}

function render(s) {
  st = s; fetchedAt = Date.now();
  const n = s.now, playing = n.file;
  $('#state').textContent = s.paused ? '⏸ متوقف — شنونده‌ها سکوت می‌شنوند' : '● در حال پخش';
  $('#state').classList.toggle('paused', s.paused);
  $('#title').textContent = n.title || (playing ? base(playing) : 'چیزی پخش نمی‌شود');
  $('#artist').textContent = n.artist || dir(playing);
  $('#pause').textContent = s.paused ? '▶ ادامه' : '⏸ توقف';
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === s.mode));
  tick();

  $('#queue-card').hidden = s.queue.length === 0;
  $('#queue-count').textContent = s.queue.length ? `${s.queue.length} آهنگ` : '';
  $('#queue').innerHTML = s.queue.map((f, i) =>
    `<li class="row"><span class="num">${i + 1}</span><span class="meta"><span class="nm" dir="auto">${esc(base(f))}</span><span class="fd" dir="auto">${esc(dir(f))}</span></span></li>`).join('');

  const key = JSON.stringify(s.tracks);
  if (key !== tracksKey && dragFrom === null) { tracksKey = key; renderTracks(); }
  markTracks();
  renderLibrary(false);
}

function tick() {
  if (!st) return;
  const n = st.now;
  const e = n.elapsed + (st.paused ? 0 : (Date.now() - fetchedAt) / 1000);
  $('#elapsed').textContent = fmt(Math.min(e, n.duration > 0 ? n.duration : e));
  $('#duration').textContent = fmt(n.duration);
  $('#progress').style.width = n.duration > 0 ? Math.min(100, e / n.duration * 100) + '%' : '0';
}

function renderTracks() {
  const t = st.tracks;
  $('#count').textContent = `${t.length} آهنگ`;
  $('#tracks').innerHTML = t.length ? t.map((f, i) => `
    <li class="row" draggable="true" data-i="${i}">
      <span class="grip" title="بکش و جابه‌جا کن">⋮⋮</span>
      <span class="num">${i + 1}</span>
      <span class="meta"><span class="nm" dir="auto">${esc(base(f))}</span><span class="sub"><span class="fd" dir="auto">${esc(dir(f))}</span><span class="tag"></span></span></span>
      <span class="acts">
        <button data-act="play" title="همین حالا پخش کن">▶</button>
        <button data-act="next" title="بعد از آهنگ فعلی پخش کن">بعدی</button>
        <button data-act="up" title="یکی بالاتر">▲</button>
        <button data-act="down" title="یکی پایین‌تر">▼</button>
        <button data-act="remove" class="del" title="حذف از لیست (فایل پاک نمی‌شود)">✕</button>
      </span>
    </li>`).join('') : '<li class="empty">لیست خالیه. از کتابخانه آهنگ اضافه کن.</li>';
}

function markTracks() {
  document.querySelectorAll('#tracks .row').forEach(li => {
    const i = +li.dataset.i, f = st.tracks[i];
    const isPlaying = f === st.now.file;
    li.classList.toggle('playing', isPlaying);
    li.querySelector('.tag').textContent = isPlaying ? '♪ در حال پخش' : (i === st.next_index ? 'بعدی' : '');
  });
}

function saveTracks(list, msg) { return post('tracks', { tracks: list }, msg); }
function move(list, from, to) { const a = list.slice(); a.splice(to, 0, a.splice(from, 1)[0]); return a; }

$('#tracks').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = +b.closest('.row').dataset.i, t = st.tracks, f = t[i];
  if (b.dataset.act === 'play') post('play', { file: f, index: i }, 'پخش شد');
  if (b.dataset.act === 'next') post('next', { file: f }, 'به صف اضافه شد');
  if (b.dataset.act === 'up' && i > 0) saveTracks(move(t, i, i - 1));
  if (b.dataset.act === 'down' && i < t.length - 1) saveTracks(move(t, i, i + 1));
  if (b.dataset.act === 'remove') saveTracks(t.filter((_, j) => j !== i), 'از لیست حذف شد');
});

const tl = $('#tracks');
tl.addEventListener('dragstart', e => {
  const li = e.target.closest('.row'); if (!li) return;
  dragFrom = +li.dataset.i; li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragFrom));
});
tl.addEventListener('dragover', e => {
  const li = e.target.closest('.row'); if (!li || dragFrom === null) return;
  e.preventDefault();
  tl.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
  li.classList.add('drag-over');
});
tl.addEventListener('drop', e => {
  e.preventDefault();
  const li = e.target.closest('.row'), from = dragFrom;
  dragFrom = null;
  if (!li || from === null) return;
  const to = +li.dataset.i;
  if (to !== from) saveTracks(move(st.tracks, from, to));
});
tl.addEventListener('dragend', () => {
  dragFrom = null;
  tl.querySelectorAll('.dragging, .drag-over').forEach(x => x.classList.remove('dragging', 'drag-over'));
});

function filteredLibrary() {
  const q = $('#search').value.trim().toLowerCase(), fd = $('#folder').value;
  return lib.filter(f => (!fd || f.startsWith(fd + '/')) && (!q || f.toLowerCase().includes(q)));
}

let libKey = '';
function renderLibrary(force) {
  if (!st) return;
  const items = filteredLibrary(), inList = new Set(st.tracks);
  const key = force + '|' + items.length + '|' + $('#search').value + '|' + $('#folder').value + '|' + tracksKey;
  if (!force && key === libKey) return;
  libKey = key;
  $('#lib-count').textContent = `${items.length} از ${lib.length}`;
  $('#library').innerHTML = items.length ? items.map(f => `
    <li class="row" data-f="${esc(f)}">
      <span class="meta"><span class="nm" dir="auto">${esc(base(f))}</span><span class="fd" dir="auto">${esc(dir(f))}</span></span>
      ${inList.has(f) ? '<span class="in-list">✓ در لیست</span>' : ''}
      <span class="acts">
        <button data-act="add" title="به انتهای لیست پخش اضافه کن">＋</button>
        <button data-act="next" title="بعد از آهنگ فعلی پخش کن">بعدی</button>
        <button data-act="play" title="همین حالا پخش کن">▶</button>
      </span>
    </li>`).join('') : '<li class="empty">چیزی پیدا نشد.</li>';
}

$('#library').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const f = b.closest('.row').dataset.f;
  if (b.dataset.act === 'add') saveTracks([...st.tracks, f], 'به لیست اضافه شد');
  if (b.dataset.act === 'next') post('next', { file: f }, 'به صف اضافه شد');
  if (b.dataset.act === 'play') post('play', { file: f, index: -1 }, 'پخش شد');
});

$('#add-all').onclick = () => {
  const have = new Set(st.tracks), add = filteredLibrary().filter(f => !have.has(f));
  if (!add.length) return toast('همه‌شون از قبل توی لیست هستن');
  if (add.length > 20 && !confirm(`${add.length} آهنگ به لیست اضافه بشه؟`)) return;
  saveTracks([...st.tracks, ...add], `${add.length} آهنگ اضافه شد`);
};

async function loadLibrary(refresh) {
  lib = await call('library' + (refresh ? '?refresh=1' : ''));
  const folders = [...new Set(lib.filter(f => f.includes('/')).map(f => f.split('/')[0]))].sort();
  const sel = $('#folder'), cur = sel.value;
  sel.innerHTML = '<option value="">همه‌ی پوشه‌ها</option>' + folders.map(x => `<option>${esc(x)}</option>`).join('');
  sel.value = cur;
  renderLibrary(true);
  if (refresh) toast('کتابخانه دوباره خوانده شد');
}

$('#search').oninput = () => renderLibrary(true);
$('#folder').onchange = () => renderLibrary(true);
$('#rescan').onclick = () => loadLibrary(true);
$('#pause').onclick = () => post('pause', { paused: !st.paused });
$('#skip').onclick = () => post('skip', {}, 'رفت آهنگ بعدی');
$('#clear-queue').onclick = () => post('queue/clear', {}, 'صف پاک شد');
$('#modes').onclick = e => { const b = e.target.closest('button'); if (b) post('mode', { mode: b.dataset.mode }, b.textContent); };

// same low-latency player as the listener page, served by the :8000 front door
const radioHost = `http://${location.hostname}:8000`;
document.head.appendChild(Object.assign(document.createElement('script'), { src: radioHost + '/listen/live.js' }));
let radio = null;
$('#listen').onclick = () => {
  radio ??= window.createLivePlayer && createLivePlayer($('#player'), radioHost + '/stream');
  if (!radio) return toast('پلیر رادیو (پورت 8000) در دسترس نیست');
  if (!radio.wanted) {
    radio.start().catch(e => e.name === 'NotAllowedError' && toast('پخش در مرورگر شروع نشد'));
    $('#listen').textContent = '🔇 قطع صدا';
  } else {
    radio.stop();
    $('#listen').textContent = '🎧 گوش دادن';
  }
};

async function refresh() {
  if (document.hidden) return;
  try { render(await call('status')); } catch (e) { $('#state').textContent = 'پنل به رادیو وصل نیست'; }
}
async function listeners() {
  try {
    const s = (await (await fetch(`http://${location.hostname}:8000/status-json.xsl`)).json()).icestats.source;
    const src = [].concat(s || []).find(x => (x.listenurl || '').endsWith('/radio'));
    $('#listeners').textContent = src ? `${src.listeners} شنونده` : '';
  } catch (e) { $('#listeners').textContent = ''; }
}

refresh().then(() => loadLibrary(false));
listeners();
setInterval(refresh, 2000);
setInterval(tick, 500);
setInterval(listeners, 10000);
document.addEventListener('visibilitychange', refresh);
</script>
</body>
</html>
