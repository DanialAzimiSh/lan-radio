# Port 8000 front door for the radio.
#   /radio   browsers (Accept: text/html) get the listener page (a design from listen/themes/); players get the Icecast stream as before
#   /stream  always the audio (the page plays this; use it for players that pretend to be browsers)
#   /api/now, /api/cover   read-only data from Liquidsoap; its control API stays on 8001 only
#   /api/like, /api/react, /api/message, /api/request, /api/upload   what listeners write (rate-limited)
#   /api/catalog           the tracks a listener may ask for
#   anything else          Icecast (status-json.xsl, radio.m3u, /admin/, ...)

# Likes, reactions, messages, requests and uploads are the only things listeners write. Behind Docker Desktop every client
# arrives from the same address, so these are in effect station-wide limits.
limit_req_zone $binary_remote_addr zone=likes:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=reactions:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=messages:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=catalog:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=requests:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=uploads:1m rate=2r/m;
limit_req_status 429;

# The listener page has more than one design (listen/themes/<name>/). /radio?theme=tube switches this browser
# to a design (remembered in a cookie); with neither, the station's default design below is used.
map $arg_theme $theme_arg {
    default "";
    vinyl   vinyl;
    tube    tube;
}
map $cookie_theme $theme_cookie {
    default vinyl;      # <- the station's default design
    vinyl   vinyl;
    tube    tube;
}
map $theme_arg $theme {
    ""      $theme_cookie;
    default $theme_arg;
}
map $theme_arg $theme_set {
    ""      "";
    default "theme=$theme_arg; Path=/; Max-Age=31536000; SameSite=Lax";
}

map $http_accept $wants_page {
    default      0;
    "~*text/html" 1;
}

server {
    listen 8000;

    # resolve containers per request, so nginx starts even if icecast/radio are not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $icecast http://icecast:8000;
    set $liquidsoap http://radio:8001;
    set $mount /radio;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    location = /radio {
        add_header Vary Accept always;
        if ($wants_page) {
            rewrite ^ /listen/themes/$theme/ last;
        }
        rewrite ^ $mount break;
        proxy_pass $icecast;
    }

    location = /stream {
        rewrite ^ $mount break;
        proxy_pass $icecast;
    }

    location /listen/ {
        alias /usr/share/nginx/listen/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header Set-Cookie $theme_set;
    }

    location /listen/fonts/ {
        alias /usr/share/nginx/listen/fonts/;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /api/now {
        limit_except GET { deny all; }
        proxy_pass $liquidsoap;
    }

    location = /api/cover {
        limit_except GET { deny all; }
        proxy_pass $liquidsoap;
    }

    location = /api/like {
        limit_except POST { deny all; }
        limit_req zone=likes burst=20 nodelay;
        client_max_body_size 1k;
        proxy_pass $liquidsoap;
    }

    location = /api/react {
        limit_except POST { deny all; }
        limit_req zone=reactions burst=40 nodelay;
        client_max_body_size 1k;
        proxy_pass $liquidsoap;
    }

    location = /api/message {
        limit_except POST { deny all; }
        limit_req zone=messages burst=3 nodelay;
        client_max_body_size 4k;
        proxy_pass $liquidsoap;
    }

    location = /api/catalog {
        limit_except GET { deny all; }
        limit_req zone=catalog burst=10 nodelay;
        proxy_pass $liquidsoap;
    }

    location = /api/request {
        limit_except POST { deny all; }
        limit_req zone=requests burst=3 nodelay;
        client_max_body_size 4k;
        proxy_pass $liquidsoap;
    }

    # a listener's song file, 30 MB at most; Liquidsoap checks it and keeps it in quarantine
    location = /api/upload {
        limit_except POST { deny all; }
        limit_req zone=uploads burst=2 nodelay;
        client_max_body_size 30m;
        proxy_pass $liquidsoap;
    }

    location / {
        proxy_pass $icecast;
    }
}
