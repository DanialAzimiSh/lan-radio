# Port 8000 front door for the radio.
#   /radio   browsers (Accept: text/html) get the listener page; players get the Icecast stream as before
#   /stream  always the audio (the page plays this; use it for players that pretend to be browsers)
#   /api/now, /api/cover   read-only data from Liquidsoap; its control API stays on 8001 only
#   anything else          Icecast (status-json.xsl, radio.m3u, /admin/, ...)

map $http_accept $wants_page {
    default      0;
    "~*text/html" 1;
}

server {
    listen 8000;

    # resolve containers per request, so nginx starts even if icecast/radio are not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $icecast http://icecast:8000;
    set $liquidsoap http://radio:8001;
    set $mount /radio;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    location = /radio {
        add_header Vary Accept always;
        if ($wants_page) {
            rewrite ^ /listen/ last;
        }
        rewrite ^ $mount break;
        proxy_pass $icecast;
    }

    location = /stream {
        rewrite ^ $mount break;
        proxy_pass $icecast;
    }

    location /listen/ {
        alias /usr/share/nginx/listen/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location /listen/fonts/ {
        alias /usr/share/nginx/listen/fonts/;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /api/now {
        limit_except GET { deny all; }
        proxy_pass $liquidsoap;
    }

    location = /api/cover {
        limit_except GET { deny all; }
        proxy_pass $liquidsoap;
    }

    location / {
        proxy_pass $icecast;
    }
}
