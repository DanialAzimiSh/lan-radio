# Settings come from .env (copy .env.example to .env and fill it in); compose refuses to start without them.
# restart: always (not unless-stopped) - Docker Desktop's shutdown counts as a stop, so unless-stopped stayed down after reboots
services:
  icecast:
    image: infiniteproject/icecast:latest
    container_name: icecast
    restart: always

    # no host port: the web service below owns :8000 and forwards everything that is not the listener page
    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:?set ICECAST_SOURCE_PASSWORD in .env}
      - ICECAST_RELAY_PASSWORD=${ICECAST_RELAY_PASSWORD:?set ICECAST_RELAY_PASSWORD in .env}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD:?set ICECAST_ADMIN_PASSWORD in .env}
      - ICECAST_ADMIN_USERNAME=${ICECAST_ADMIN_USERNAME:-admin}
      - ICECAST_HOSTNAME=${RADIO_HOST:?set RADIO_HOST in .env}

    volumes:
      - icecast_logs:/var/log/icecast2

  radio:
    image: savonet/liquidsoap:v2.3.3
    container_name: radio
    restart: always
    depends_on:
      - icecast
    command: ["/radio/radio.liq"]

    # control panel: http://<RADIO_HOST>:8001
    ports:
      - "8001:8001"

    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:?set ICECAST_SOURCE_PASSWORD in .env}

    # the music folder stays read-only; only its radio/ subfolder is writable (playlist.m3u + radio-state.json)
    volumes:
      - ./radio.liq:/radio/radio.liq:ro
      - ./panel.html:/radio/panel.html:ro
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro
      - ${MUSIC_DIR}/radio:/music/radio

  # :8000 front door - http://<RADIO_HOST>:8000/radio is the listener page in a browser and the stream for players
  web:
    image: nginx:1.27.5-alpine
    container_name: radio-web
    restart: always
    depends_on:
      - icecast
      - radio

    ports:
      - "8000:8000"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./listen:/usr/share/nginx/listen:ro

volumes:
  icecast_logs:
