# Settings come from .env (copy .env.example to .env and fill it in); compose refuses to start without them.
# restart: always (not unless-stopped) - Docker Desktop's shutdown counts as a stop, so unless-stopped stayed down after reboots
services:
  icecast:
    image: infiniteproject/icecast:latest
    container_name: icecast
    restart: always

    # Icecast keeps MP3 metadata as ISO-8859-1 unless a mount says otherwise, so every Persian title reached
    # players and the status page as "******". Declare UTF-8 for all mounts (once) before starting.
    command:
      - /bin/sh
      - -c
      - >-
        grep -q '<charset>UTF-8</charset>' /etc/icecast.xml
        || sed -i 's|</icecast>|<mount type="default"><charset>UTF-8</charset></mount></icecast>|' /etc/icecast.xml;
        exec icecast -c /etc/icecast.xml

    # no host port: the web service below owns :8000 and forwards everything that is not the listener page
    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:?set ICECAST_SOURCE_PASSWORD in .env}
      - ICECAST_RELAY_PASSWORD=${ICECAST_RELAY_PASSWORD:?set ICECAST_RELAY_PASSWORD in .env}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD:?set ICECAST_ADMIN_PASSWORD in .env}
      - ICECAST_ADMIN_USERNAME=${ICECAST_ADMIN_USERNAME:-admin}
      - ICECAST_HOSTNAME=${RADIO_HOST:?set RADIO_HOST in .env}

    volumes:
      - icecast_logs:/var/log/icecast2

  radio:
    image: savonet/liquidsoap:v2.3.3
    container_name: radio
    restart: always
    depends_on:
      - icecast
    command: ["/radio/radio.liq"]

    # 8001: control panel http://<RADIO_HOST>:8001
    # 8005: live input /live (the panel's «پخش زنده», or BUTT/Mixxx/ffmpeg with LIVE_PASSWORD)
    ports:
      - "8001:8001"
      - "8005:8005"

    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:?set ICECAST_SOURCE_PASSWORD in .env}
      - LIVE_PASSWORD=${LIVE_PASSWORD:?set LIVE_PASSWORD in .env}
      - PANEL_PASSWORD=${PANEL_PASSWORD:?set PANEL_PASSWORD in .env}

    # the music folder stays read-only; only its radio/ subfolder is writable (playlist.m3u + radio-state.json)
    # radio_data holds radio.db (logins, likes): SQLite's locking is unreliable on Windows bind mounts.
    # It is mounted on the liquidsoap user's home so the (non-root) radio can write to it.
    volumes:
      - ./radio.liq:/radio/radio.liq:ro
      - ./panel:/radio/panel:ro
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro
      - ${MUSIC_DIR}/radio:/music/radio
      - radio_data:/var/cache/liquidsoap

  # :8000 front door - http://<RADIO_HOST>:8000/radio is the listener page in a browser and the stream for players
  web:
    image: nginx:1.27.5-alpine
    container_name: radio-web
    restart: always
    depends_on:
      - icecast
      - radio

    ports:
      - "8000:8000"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./listen:/usr/share/nginx/listen:ro

  # :8002 database viewer - a browser UI for radio.db (SQLite has no network protocol of its own, so this is how
  # you "connect" to it). Read-only and behind DB_PASSWORD; drop -r below to be able to edit rows.
  db:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-alpine
        RUN pip install --no-cache-dir sqlite-web
    container_name: radio-db
    restart: always
    command: ["sqlite_web", "-H", "0.0.0.0", "-p", "8080", "-x", "-r", "-P", "/data/radio.db"]
    environment:
      - SQLITE_WEB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "8002:8080"
    volumes:
      - radio_data:/data

volumes:
  icecast_logs:
  radio_data:
