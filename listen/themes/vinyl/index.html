<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>رادیو · زنده</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📻%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/listen/notices.css">
<link rel="stylesheet" href="/listen/channels.css">
<link rel="stylesheet" href="/listen/notes.css">
<link rel="stylesheet" href="/listen/lists.css">
<link rel="stylesheet" href="/listen/player.css">
<link rel="stylesheet" href="/listen/compact.css">
</head>
<body>
<div class="backdrop"><div id="bg-a"></div><div id="bg-b"></div></div>
<div class="vignette"></div>

<main id="app">
  <header class="top">
    <div class="brand"><b>رادیو</b><small>LAN RADIO</small></div>
    <section class="channel-ruler" id="channel-ruler" aria-label="کانال‌ها" hidden=""></section>
    <div class="onair"><i></i>ON AIR</div>
  </header>

  <section class="deck">
    <div class="turntable">
      <canvas id="viz"></canvas>
      <div class="vinyl"><div class="label" id="label"><img id="cover" alt="" hidden=""><span class="note" id="note">♪</span></div><div class="hole"></div></div>
      <div class="arm"><div class="base"></div><div class="rod"><div class="head"></div></div></div>
    </div>

    <div class="info">
      <div class="kicker"><span class="eq"><span></span><span></span><span></span></span><span id="kicker">در حال پخش</span></div>
      <h1 id="title" dir="auto">…</h1>
      <p class="artist" id="artist" dir="auto"></p>
      <div class="progress" dir="ltr"><div id="bar"></div></div>
      <div class="times" dir="ltr"><span id="elapsed"></span><span id="duration"></span></div>

      <div class="controls">
        <button class="play" id="play" aria-label="پخش">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"></path></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2"></rect><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"></rect></svg>
        </button>
        <div class="volume">
          <button id="mute" aria-label="بی‌صدا"><svg viewBox="0 0 24 24"><path id="spk" d="M4 9.5v5a1 1 0 0 0 1 1h3l4.3 3.6a.8.8 0 0 0 1.3-.6V5.5a.8.8 0 0 0-1.3-.6L8 8.5H5a1 1 0 0 0-1 1zm12.2-2.1a1 1 0 0 1 1.4 0 6.5 6.5 0 0 1 0 9.2 1 1 0 1 1-1.4-1.4 4.5 4.5 0 0 0 0-6.4 1 1 0 0 1 0-1.4z"></path></svg></button>
          <input id="vol" type="range" min="0" max="100" value="80" aria-label="بلندی صدا">
        </div>
        <div class="love-wrap">
          <button class="love" id="love" aria-label="دوستش دارم" title="دوستش دارم" hidden="">
            <span class="beat"><svg class="heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.2C.9 7.8 3.2 4 6.9 4c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.7 0 6 3.8 4.5 7.3-2.1 4.6-9.6 9.2-9.6 9.2z"></path></svg></span>
            <span class="love-fx" id="love-fx" aria-hidden="true"></span>
          </button>
          <span class="love-n" id="love-n" hidden=""></span>
        </div>
        <div class="listeners" id="listeners"></div>
      </div>
      <div class="react">
        <div class="faces" id="faces" hidden="">
          <button class="face" data-kind="fire" title="آتیش"><span class="e">🔥</span><span class="rfx"></span></button>
          <button class="face" data-kind="clap" title="دمت گرم"><span class="e">👏</span><span class="rfx"></span></button>
          <button class="face" data-kind="wow" title="وای"><span class="e">🤩</span><span class="rfx"></span></button>
          <button class="face" data-kind="sleep" title="خوابم گرفت"><span class="e">😴</span><span class="rfx"></span></button>
        </div>
        <button class="msg-open" id="msg-open" type="button" title="پیام به رادیو">پیام به رادیو</button>
        <button class="msg-open" id="req-open" type="button" title="درخواست آهنگ">درخواست آهنگ</button>
      </div>
      <form class="msg" id="msg" hidden="">
        <input id="msg-name" maxlength="30" placeholder="اسمت (اختیاری)" autocomplete="off">
        <textarea id="msg-text" maxlength="280" rows="3" placeholder="نظر یا انتقادت را بنویس… (برای آهنگ از «درخواست آهنگ» استفاده کن)" required=""></textarea>
      <div class="msg-foot"><span id="msg-count"></span><button type="button" id="msg-cancel" title="بستن پیام">بستن</button><button type="submit" id="msg-send" title="ارسال پیام">ارسال</button></div>
      </form>
      <div class="req" id="req" hidden="">
        <input type="search" id="req-q" placeholder="اسم آهنگ یا خواننده…" autocomplete="off">
        <ul id="req-list"></ul>
        <input type="text" id="req-name" maxlength="30" placeholder="اسمت (اختیاری)" autocomplete="off">
        <div class="req-or">
          <span>آهنگ خودت را داری؟</span>
        <label title="انتخاب فایل آهنگ">انتخاب فایل<input type="file" id="req-file" accept="audio/*,.mp3,.m4a,.ogg,.opus,.flac,.wav,.aac"></label>
          <span>تا ۳۰ مگابایت؛ بعد از تأیید مدیر</span>
        </div>
        <progress id="req-bar" max="1" value="0" hidden=""></progress>
        <ul class="req-mine" id="req-mine" hidden=""></ul>
      <div class="msg-foot"><span></span><button type="button" id="req-close" title="بستن درخواست">بستن</button></div>
      </div>
      <div class="hint" id="hint">روی دکمه‌ی پخش بزن تا به رادیو وصل بشی</div>
    </div>
  </section>

  <section id="track-notes" class="track-notes" hidden="">
    <h2>دربارهٔ این آهنگ</h2>
    <p id="track-description" dir="auto"></p>
    <ul id="track-facts" dir="auto"></ul>
  </section>
  <section class="cards" id="cards">
    <div class="board" id="card-next">
      <button type="button" class="board-face" id="next-toggle" aria-expanded="false" aria-controls="next-drop" aria-label="آهنگ‌های بعدی">
        <span class="board-tag" aria-hidden="true">NEXT</span><span class="board-now" id="next-now"></span>
      </button>
      <div class="board-drop" id="next-drop" hidden=""><ol id="next"></ol></div>
    </div>
    <div class="board" id="card-recent">
      <button type="button" class="board-face" id="recent-toggle" aria-expanded="false" aria-controls="recent-drop" aria-label="اخیراً پخش شد">
        <span class="board-tag" aria-hidden="true">LAST</span><span class="board-now" id="recent-now"></span>
      </button>
      <div class="board-drop" id="recent-drop" hidden=""><ol id="history"></ol></div>
    </div>
  </section>

  <div id="notices" class="notices" aria-live="polite"></div>
  <footer>
    <label class="theme-picker">پوسته <select id="theme-select" aria-label="انتخاب پوسته"><option value="vinyl">گرامافون</option><option value="studio">استودیو · قرمز</option></select></label>
    <span>لینک مستقیم برای VLC و هر پلیری:</span>
    <code id="link"></code>
    <button id="copy" title="کپی لینک">کپی</button>
  </footer>
</main>

<script src="/listen/live.js"></script>
<script src="/listen/ruler-carousel.js"></script>
<script src="/listen/channel-links.js"></script>
<script src="/listen/vendor/gsap.min.js"></script>
<script src="/listen/vendor/Physics2DPlugin.min.js"></script>
<script src="/listen/likes.js"></script>
<script src="/listen/feedback.js"></script>
<script src="/listen/requests.js"></script>
<script src="/listen/notices.js"></script>
<script src="/listen/notes.js"></script>
<script src="/listen/lists.js"></script>
<script src="/listen/player.js"></script>

</body></html>
