<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0603">
<title>رادیو · زنده</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📻%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/listen/themes/tube/tube.css">
<link rel="stylesheet" href="/listen/widgets.css">
</head>
<body>
<div class="room"><div id="bg-a"></div><div id="bg-b"></div></div>
<div class="vignette"></div>

<main id="app">
  <header class="top">
    <div class="brand"><b>رادیو</b><small>LAN RADIO · FM</small></div>
    <div class="top-end">
      <a class="theme-link" href="/radio?theme=vinyl">🎨 طرح گرامافون</a>
      <div class="onair"><i></i>ON AIR</div>
    </div>
  </header>

  <section class="cabinet" id="cabinet">
    <div class="speaker"><canvas id="viz"></canvas><span class="plate">LAN RADIO</span></div>

    <div class="panel">
      <div class="dial" id="dial">
        <div class="glow" id="glow"></div>
        <div class="ticks" id="ticks"></div>
        <div class="track" id="dial-track"><div class="needle" id="needle"></div></div>
        <div class="freq" id="freq"><span id="freq-n">۹۸٫۰</span><small>MHz</small></div>
        <div class="eye" id="eye"><div class="gap" id="eye-gap"></div></div>
      </div>

      <div class="now">
        <div class="art" id="art"><img id="cover" alt="" hidden><span class="note" id="note">♪</span></div>
        <div class="meta-now">
          <div class="kicker"><span class="eq"><span></span><span></span><span></span></span><span id="kicker">در حال پخش</span></div>
          <h1 id="title" dir="auto">…</h1>
          <p class="artist" id="artist" dir="auto"></p>
        </div>
      </div>

      <div>
        <div class="progress" dir="ltr"><div id="bar"></div></div>
        <div class="times" dir="ltr"><span id="elapsed"></span><span id="duration"></span></div>
      </div>

      <div class="controls">
        <button class="play" id="play" aria-label="پخش">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
        </button>
        <div class="knob-wrap">
          <div class="knob-dial" id="knob-dial">
            <div class="knob" id="knob" role="slider" tabindex="0" aria-label="بلندی صدا" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80"></div>
          </div>
          <small>صدا</small>
        </div>
        <button class="mute" id="mute" aria-label="بی‌صدا"><svg viewBox="0 0 24 24"><path id="spk" d="M4 9.5v5a1 1 0 0 0 1 1h3l4.3 3.6a.8.8 0 0 0 1.3-.6V5.5a.8.8 0 0 0-1.3-.6L8 8.5H5a1 1 0 0 0-1 1zm12.2-2.1a1 1 0 0 1 1.4 0 6.5 6.5 0 0 1 0 9.2 1 1 0 1 1-1.4-1.4 4.5 4.5 0 0 0 0-6.4 1 1 0 0 1 0-1.4z"/></svg></button>
        <div class="love-wrap">
          <button class="love" id="love" aria-label="دوستش دارم" title="دوستش دارم" hidden>
            <span class="beat"><svg class="heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.2C.9 7.8 3.2 4 6.9 4c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.7 0 6 3.8 4.5 7.3-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg></span>
            <span class="love-fx" id="love-fx" aria-hidden="true"></span>
          </button>
          <span class="love-n" id="love-n" hidden></span>
        </div>
        <div class="listeners" id="listeners"></div>
      </div>
    </div>
  </section>

  <div class="stage-extra">
    <div class="react">
      <div class="faces" id="faces" hidden>
        <button class="face" data-kind="fire" title="آتیش"><span class="e">🔥</span><span class="rfx"></span></button>
        <button class="face" data-kind="clap" title="دمت گرم"><span class="e">👏</span><span class="rfx"></span></button>
        <button class="face" data-kind="wow" title="وای"><span class="e">🤩</span><span class="rfx"></span></button>
        <button class="face" data-kind="sleep" title="خوابم گرفت"><span class="e">😴</span><span class="rfx"></span></button>
      </div>
      <button class="msg-open" id="msg-open" type="button">✉ پیام به رادیو</button>
      <button class="msg-open" id="req-open" type="button">🎵 درخواست آهنگ</button>
    </div>
    <form class="msg" id="msg" hidden>
      <input id="msg-name" maxlength="30" placeholder="اسمت (اختیاری)" autocomplete="off">
      <textarea id="msg-text" maxlength="280" rows="3" placeholder="نظر یا انتقادت را بنویس… (برای آهنگ از «درخواست آهنگ» استفاده کن)" required></textarea>
      <div class="msg-foot"><span id="msg-count"></span><button type="button" id="msg-cancel">بستن</button><button type="submit" id="msg-send">ارسال</button></div>
    </form>
    <div class="req" id="req" hidden>
      <input type="search" id="req-q" placeholder="اسم آهنگ یا خواننده…" autocomplete="off">
      <ul id="req-list"></ul>
      <input type="text" id="req-name" maxlength="30" placeholder="اسمت (اختیاری)" autocomplete="off">
      <div class="req-or">
        <span>آهنگ خودت را داری؟</span>
        <label>انتخاب فایل<input type="file" id="req-file" accept="audio/*,.mp3,.m4a,.ogg,.opus,.flac,.wav,.aac"></label>
        <span>تا ۳۰ مگابایت؛ بعد از تأیید مدیر</span>
      </div>
      <progress id="req-bar" max="1" value="0" hidden></progress>
      <ul class="req-mine" id="req-mine" hidden></ul>
      <div class="msg-foot"><span></span><button type="button" id="req-close">بستن</button></div>
    </div>
    <div class="hint" id="hint">روی دکمه‌ی قرمز بزن تا به رادیو وصل بشی</div>
  </div>

  <section class="cards">
    <div class="card next">
      <h2 id="next-h">آهنگ بعدی</h2>
      <div class="track-row" id="next"><span class="empty">…</span></div>
    </div>
    <div class="card">
      <h2>اخیراً پخش شد</h2>
      <ol id="history"><li class="empty">هنوز چیزی پخش نشده</li></ol>
    </div>
  </section>

  <footer>
    <span>لینک مستقیم برای VLC و هر پلیری:</span>
    <code id="link"></code>
    <button id="copy">کپی</button>
  </footer>
</main>

<script src="/listen/live.js"></script>
<script src="/listen/vendor/gsap.min.js"></script>
<script src="/listen/vendor/Physics2DPlugin.min.js"></script>
<script src="/listen/vendor/Draggable.min.js"></script>
<script src="/listen/vendor/InertiaPlugin.min.js"></script>
<script src="/listen/vendor/SplitText.min.js"></script>
<script src="/listen/vendor/CustomEase.min.js"></script>
<script src="/listen/vendor/ScrambleTextPlugin.min.js"></script>
<script src="/listen/likes.js"></script>
<script src="/listen/feedback.js"></script>
<script src="/listen/requests.js"></script>
<script src="/listen/themes/tube/tube.js"></script>
</body>
</html>
